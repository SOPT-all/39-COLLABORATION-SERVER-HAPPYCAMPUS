services:
  app:
    build:
      context: .
    image: happycampus:latest
    restart: unless-stopped

    ports:
     - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-prod.yml
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    volumes:
     - ./application-prod.yml:/app/config/application-prod.yml:ro

    mem_limit: 640m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
