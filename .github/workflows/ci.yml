name: CI

on:
  pull_request:
    branches: [main]

jobs: # 실행할 작업들을 정의하는 영역
  build: # 우리가 정한 작업 ID. 다른 이름으로 지어도 돼
   runs-on: ubuntu-latest # GitHub이 제공하는 Ubuntu 가상 머신에서 작업을 선택한다는 뜻 

   steps: # 작업 안에서 순서대로 실행할 거임
    - name: Checkout source code
      uses: actions/checkout@v4 # 저장소 코드를 실행 환경으로

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin # 사용할 JDK 배포판
        java-version: '21' # 프로젝트의 JAVA 버전에 맞춰 지정
    
    - name: Grant execute permission for Gradle Wrapper
      run: chmod +x gradlew # 가상 머신에서 실행할 셸 명령어: 실행 권한 부여

    - name: Build and test 
      run: ./gradlew build # 가상 머신에서 실행할 셸 명령어: 컴파일 테스트 패키징 수행
